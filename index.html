<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RAUPOWTube</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <button
        id="menuToggle"
        class="icon-btn"
        type="button"
    >
        <i class="fa-solid fa-bars"></i>
    </button>

    <button
        id="homeLogo"
        class="logo"
        type="button"
    >
        <span>RAUPOW</span>
        <small>Tube</small>
    </button>

    <form
        id="searchForm"
        class="search-form"
    >

        <input
            id="searchInput"
            type="search"
            placeholder="Qidirish"
            autocomplete="off"
        >

        <button
            type="submit"
            class="search-btn"
        >
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

    </form>

    <div class="header-actions">

        <button
            id="themeToggle"
            class="icon-btn"
            type="button"
        >
            <i class="fa-solid fa-moon"></i>
        </button>

        <button
            class="icon-btn"
            type="button"
        >
            <i class="fa-regular fa-bell"></i>
        </button>

        <div class="user-avatar">
            R
        </div>

    </div>

</header>


<aside
    id="sidebar"
    class="sidebar"
>

    <nav>

        <button
            class="sidebar-item active"
            data-page="home"
            type="button"
        >
            <i class="fa-solid fa-house"></i>
            <span>Bosh sahifa</span>
        </button>

        <button
            class="sidebar-item"
            data-page="history"
            type="button"
        >
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Tarix</span>
        </button>

        <button
            class="sidebar-item"
            data-page="saved"
            type="button"
        >
            <i class="fa-solid fa-bookmark"></i>
            <span>Saqlangan</span>
        </button>

        <button
            class="sidebar-item"
            data-page="liked"
            type="button"
        >
            <i class="fa-solid fa-thumbs-up"></i>
            <span>Yoqtirganlar</span>
        </button>

        <button
            class="sidebar-item"
            data-page="subscriptions"
            type="button"
        >
            <i class="fa-solid fa-bell"></i>
            <span>Obunalar</span>
        </button>

        <button
            class="sidebar-item"
            data-page="queue"
            type="button"
        >
            <i class="fa-solid fa-list"></i>
            <span>Navbat</span>
        </button>

    </nav>

    <div class="sidebar-divider"></div>

    <div class="sidebar-title">
        Siz uchun
    </div>

    <button
        class="sidebar-item category-side"
        data-category="Music"
        type="button"
    >
        <i class="fa-solid fa-music"></i>
        <span>Musiqa</span>
    </button>

    <button
        class="sidebar-item category-side"
        data-category="Gaming"
        type="button"
    >
        <i class="fa-solid fa-gamepad"></i>
        <span>O'yinlar</span>
    </button>

    <button
        class="sidebar-item category-side"
        data-category="Programming"
        type="button"
    >
        <i class="fa-solid fa-code"></i>
        <span>Dasturlash</span>
    </button>

    <button
        class="sidebar-item category-side"
        data-category="Education"
        type="button"
    >
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Ta'lim</span>
    </button>

</aside>


<main
    id="mainContent"
    class="main-content"
>

    <div class="categories">

        <button
            class="category active"
            data-category="all"
            type="button"
        >
            Barchasi
        </button>

        <button
            class="category"
            data-category="Music"
            type="button"
        >
            Musiqa
        </button>

        <button
            class="category"
            data-category="Gaming"
            type="button"
        >
            O'yinlar
        </button>

        <button
            class="category"
            data-category="Programming"
            type="button"
        >
            Dasturlash
        </button>

        <button
            class="category"
            data-category="Education"
            type="button"
        >
            Ta'lim
        </button>

        <button
            class="category"
            data-category="Technology"
            type="button"
        >
            Texnologiya
        </button>

        <button
            class="category"
            data-category="News"
            type="button"
        >
            Yangiliklar
        </button>

        <button
            class="category"
            data-category="Sports"
            type="button"
        >
            Sport
        </button>

        <button
            class="category"
            data-category="Movies"
            type="button"
        >
            Filmlar
        </button>

    </div>


    <section
        id="content"
        class="content"
    >

        <div class="loading-screen">

            <div class="spinner"></div>

            <h2>
                RAUPOWTube
            </h2>

            <p>
                Eng yangi videolar yuklanmoqda...
            </p>

        </div>

    </section>

</main>


<div
    id="playerModal"
    class="player-modal"
>

    <div class="player-container">

        <div class="player-top">

            <button
                id="closePlayer"
                class="icon-btn"
                type="button"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="player-top-title">
                RAUPOWTube Player
            </div>

        </div>


        <div class="player-layout">

            <div class="player-main">

                <div class="player-video">

                    <iframe
                        id="youtubePlayer"
                        src="about:blank"
                        title="RAUPOWTube Player"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen
                        referrerpolicy="strict-origin-when-cross-origin"
                    ></iframe>

                </div>


                <div class="player-info">

                    <h2 id="playerTitle">
                        Video
                    </h2>

                    <div class="player-meta">

                        <span id="playerChannel"></span>

                        <span id="playerViews"></span>

                        <span id="playerDate"></span>

                    </div>


                    <div class="player-actions">

                        <button
                            id="playerLike"
                            class="player-action"
                            type="button"
                        >
                            <i class="fa-regular fa-thumbs-up"></i>
                            <span>Like</span>
                        </button>

                        <button
                            id="playerDislike"
                            class="player-action"
                            type="button"
                        >
                            <i class="fa-regular fa-thumbs-down"></i>
                            <span>Dislike</span>
                        </button>

                        <button
                            id="playerSave"
                            class="player-action"
                            type="button"
                        >
                            <i class="fa-regular fa-bookmark"></i>
                            <span>Saqlash</span>
                        </button>

                        <button
                            id="playerShare"
                            class="player-action"
                            type="button"
                        >
                            <i class="fa-solid fa-share"></i>
                            <span>Ulashish</span>
                        </button>

                        <button
                            id="subscribeButton"
                            class="subscribe-btn"
                            type="button"
                        >
                            Obuna bo'lish
                        </button>

                    </div>


                    <div class="video-description-box">

                        <div class="description-header">

                            <strong>
                                Video haqida
                            </strong>

                            <button
                                id="descriptionToggle"
                                type="button"
                            >
                                Ko'proq
                            </button>

                        </div>

                        <div
                            id="playerDescription"
                            class="player-description"
                        >
                            Video tavsifi
                        </div>

                    </div>

                </div>


                <section class="comments-section">

                    <div class="comments-title">

                        <h3>

                            <i class="fa-regular fa-comment"></i>

                            <span id="commentsCount">
                                0
                            </span>

                            ta kommentariya

                        </h3>

                    </div>


                    <form
                        id="commentForm"
                        class="comment-form"
                    >

                        <div class="comment-avatar">
                            R
                        </div>

                        <div class="comment-input-area">

                            <textarea
                                id="commentInput"
                                rows="1"
                                maxlength="500"
                                placeholder="Kommentariya qo'shing..."
                            ></textarea>

                            <div class="comment-form-actions">

                                <span id="commentCounter">
                                    0 / 500
                                </span>

                                <button
                                    id="cancelComment"
                                    class="comment-cancel"
                                    type="button"
                                >
                                    Bekor qilish
                                </button>

                                <button
                                    class="comment-submit"
                                    type="submit"
                                >
                                    Kommentariya
                                </button>

                            </div>

                        </div>

                    </form>


                    <div
                        id="commentsList"
                        class="comments-list"
                    ></div>

                </section>

            </div>


            <aside class="recommended-sidebar">

                <div class="recommended-header">

                    <h3>
                        Tavsiya etilgan
                    </h3>

                </div>

                <div
                    id="recommendedVideos"
                    class="recommended-list"
                ></div>

            </aside>

        </div>

    </div>

</div>


<div
    id="raupowToast"
    class="raupow-toast"
></div>


<script src="script.js"></script>

</body>
</html>
